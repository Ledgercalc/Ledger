<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E16" />
<title>Ledger</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />

<!-- Tailwind via CDN (the component uses Tailwind utility classes) -->
<script src="https://cdn.tailwindcss.com"></script>

<!--
  Import map: lets the browser resolve bare specifiers like "react",
  "lucide-react", "recharts" natively, without a bundler. esm.sh serves
  browser-ready ES module builds. `external=react` / `external=react,react-dom`
  keeps lucide-react and recharts from bundling their own copy of React,
  which would break hooks (two React instances = broken state).
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>

<!-- Babel standalone: transpiles JSX in the browser at load time. -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { background: #05070C; }
</style>
</head>
<body>
<div id="root"></div>

<!--
  data-type="module" tells Babel standalone to transpile this file's JSX
  but leave its import/export statements as native ES module syntax, so
  the browser (via the import map above) resolves "react", "lucide-react",
  etc. itself. LedgerApp.jsx mounts itself at the bottom of the file.
-->
<script type="text/babel" data-presets="react" data-type="module" src="./LedgerApp.jsx"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
