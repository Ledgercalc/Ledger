<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Ledger — Trade Math Calculator</title>

<meta name="theme-color" content="#0A0E16" />
<meta name="description" content="Ledger — prop firm risk, position sizing, FX conversion, equity curve, journal, and trading insights." />

<!-- iOS / PWA install hints -->
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Tailwind (JIT, no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Import map: lets the browser resolve bare "react" / "recharts" / "lucide-react"
     imports straight from esm.sh, all sharing one copy of React -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; background: #05070C; height: 100%; }
  #root { height: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100dvh;color:#7C8AA0;font-family:monospace;font-size:13px;">
    Loading Ledger&hellip;
  </div>
</div>

<!-- Babel standalone: only used to strip JSX out of LedgerApp.jsx at load time -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";

  async function boot() {
    try {
      const res = await fetch("./LedgerApp.jsx", { cache: "no-store" });
      if (!res.ok) throw new Error("Couldn't fetch LedgerApp.jsx (HTTP " + res.status + ")");
      const source = await res.text();

      // Only strip JSX (leave the ES module import/export statements alone —
      // the browser's native module loader + the import map above resolve those).
      const { code } = Babel.transform(source, {
        presets: ["react"],
        filename: "LedgerApp.jsx",
      });

      const blob = new Blob([code], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const mod = await import(url);
      URL.revokeObjectURL(url);

      const LedgerApp = mod.default;
      const root = createRoot(document.getElementById("root"));
      root.render(React.createElement(LedgerApp));

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    } catch (err) {
      console.error(err);
      document.getElementById("root").innerHTML =
        '<div style="padding:24px;color:#DB6B63;font-family:monospace;font-size:13px;white-space:pre-wrap;">' +
        "Failed to load Ledger.\n\n" + String(err && err.message ? err.message : err) +
        '\n\nMake sure LedgerApp.jsx is in the same folder as index.html.</div>';
    }
  }

  boot();
</script>
</body>
</html>
