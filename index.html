<!-- Replaces the Claude-artifact-only window.storage API with a localStorage-backed
     version using the same get/set/delete/list shape, so the app's code barely changes
     and your data now actually persists on your device. -->
<script>
(function () {
  window.storage = {
    get: function (key) {
      return new Promise(function (resolve, reject) {
        var v = localStorage.getItem(key);
        if (v === null) { reject(new Error("not found: " + key)); return; }
        resolve({ key: key, value: v, shared: false });
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve, reject) {
        try {
          localStorage.setItem(key, value);
          resolve({ key: key, value: value, shared: false });
        } catch (e) { reject(e); }
      });
    },
    delete: function (key) {
      return new Promise(function (resolve) {
        localStorage.removeItem(key);
        resolve({ key: key, deleted: true, shared: false });
      });
    },
    list: function (prefix) {
      return new Promise(function (resolve) {
        var keys = Object.keys(localStorage).filter(function (k) {
          return !prefix || k.indexOf(prefix) === 0;
        });
        resolve({ keys: keys, prefix: prefix, shared: false });
      });
    },
  };
})();
</script>

/* ---------- lightweight SVG equity chart (replaces Recharts) ---------- */
function EquityChart({ data, startBal, positive }) {
  if (!data || data.length < 2) return null;
  const width = 400, height = 180, padX = 8, padY = 10;
  const ys = data.map((d) => d.equity);
  let minY = Math.min(...ys, startBal);
  let maxY = Math.max(...ys, startBal);
  const rangeY = maxY - minY || 10;
  const pad = rangeY * 0.12 || 10;
  minY -= pad; maxY += pad;
  const xMax = data[data.length - 1].trade || 1;
  const scaleX = (x) => padX + (x / xMax) * (width - padX * 2);
  const scaleY = (y) => height - padY - ((y - minY) / (maxY - minY)) * (height - padY * 2);
  const points = data.map((d) => `${scaleX(d.trade)},${scaleY(d.equity)}`).join(" ");
  const refY = scaleY(startBal);
  const color = positive ? palette.green : palette.red;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "180px", display: "block" }} preserveAspectRatio="none">
      <line x1={padX} y1={refY} x2={width - padX} y2={refY} stroke={palette.textFaint} strokeDasharray="4 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function nextOccurrenceMs(ev) {
  if (!ev.date) return Infinity;
  const [h, m] = ev.time.split(":").map(Number);
  const [y, mo, da] = ev.date.split("-").map(Number);
  return new Date(y, mo - 1, da, h, m, 0, 0).getTime();
}

function formatCountdown(ms) {
  if (!Number.isFinite(ms) || ms < 0) return "\u2014";
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

function LedgerApp() {
  const [activeTab, setActiveTab] = useState("edge");

  const [edge, setEdge] = useState({

  const [tradeInput, setTradeInput] = useState("");
  const [tradeNote, setTradeNote] = useState("");
  const [tradeEmotion, setTradeEmotion] = useState(null);
  const [startingBalance, setStartingBalance] = useState("");
  const [storageError, setStorageError] = useState("");
  const [calMonth, setCalMonth] = useState(() => new Date());
  const [selectedDay, setSelectedDay] = useState(null);

  const [newsEvents, setNewsEvents] = useState([]);
  const [newsLoaded, setNewsLoaded] = useState(false);

  const [newEventImpact, setNewEventImpact] = useState("high");
  const [newEventDate, setNewEventDate] = useState("");
  const [newEventTime, setNewEventTime] = useState("18:30");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [tradesRes, balRes] = await Promise.allSettled([
          window.storage.get(STORAGE_KEY, false),
          window.storage.get(STORAGE_BAL_KEY, false),
        ]);
        if (cancelled) return;
        if (tradesRes.status === "fulfilled" && tradesRes.value) {
          const parsed = JSON.parse(tradesRes.value.value);
          if (Array.isArray(parsed)) setTrades(parsed);
        }
        if (balRes.status === "fulfilled" && balRes.value) {
          setStartingBalance(balRes.value.value);
        }
      } catch (err) {
        if (!cancelled) setStorageError("Couldn't load saved trades.");
      } finally {
        if (!cancelled) setTradesLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get(NEWS_STORAGE_KEY, false);
        if (cancelled) return;
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed)) setNewsEvents(parsed);
        }
      } catch (err) {
        if (!cancelled) setStorageError("Couldn't load saved events.");
      } finally {
        if (!cancelled) setNewsLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const persistNews = async (next) => {
    setNewsEvents(next);
    try { await window.storage.set(NEWS_STORAGE_KEY, JSON.stringify(next), false); } catch (err) {}
  };

  const addNewsEvent = () => {
    if (!newEventName.trim() || !newEventTime || !newEventDate) return;
    const next = [...newsEvents, {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      name: newEventName.trim(), impact: newEventImpact, date: newEventDate, time: newEventTime,
    }];
    persistNews(next);
    setNewEventName(""); setNewEventDate("");
  };

  const deleteNewsEvent = (id) => persistNews(newsEvents.filter((e) => e.id !== id));

  const persistTrades = async (next) => {
    setTrades(next);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      if (!res) setStorageError("Trade wasn't saved, please retry.");
      else setStorageError("");
    } catch (err) { setStorageError("Trade wasn't saved, please retry."); }
  };

  const persistStartingBalance = async (val) => {
    setStartingBalance(val);
    try { await window.storage.set(STORAGE_BAL_KEY, val, false); } catch (err) {}
  };

  const addTrade = () => {
    const pnl = num(tradeInput);
    if (!tradeInput || pnl === 0) return;
    const next = [...trades, {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      pnl, note: tradeNote.trim(), emotion: tradeEmotion, ts: Date.now(),
    }];
    persistTrades(next);
    setTradeInput(""); setTradeNote(""); setTradeEmotion(null);
  };

  const deleteTrade = (id) => persistTrades(trades.filter((t) => t.id !== id));
  const clearTrades = () => persistTrades([]);

  const applyPreset = (preset) => {
    const defaults = { forex: "10", gold: "1", custom: ps.valuePerPip };
    setPs({ ...ps, preset, valuePerPip: defaults[preset] });
  };

  let body = null;

  if (activeTab === "edge") {
    const risk = Math.abs(num(edge.entry) - num(edge.stop));
    const reward = Math.abs(num(edge.target) - num(edge.entry));
    const ratio = risk > 0 ? reward / risk : 0;
    const rrBeWin = risk + reward > 0 ? (risk / (risk + reward)) * 100 : 0;

    const aw = num(edge.avgWin);
    const al = num(edge.avgLoss);
    const buf = num(edge.buffer);
    const dollarBe = aw + al > 0 ? (al / (aw + al)) * 100 : 0;
    const targetWinRate = Math.min(100, dollarBe + buf);
    const beWin = dollarBe || rrBeWin;

    const totalTrades = num(edge.totalTrades);
    const computedWinRate = aw + al > 0 ? (aw / (aw + al)) * 100 : 0;
    const hasExpectancyInputs = aw > 0 || al > 0;
    const expectancy = hasExpectancyInputs ? (computedWinRate / 100) * aw - (1 - computedWinRate / 100) * al : 0;
    const per100 = expectancy * 100;
    const hasTotalProjection = hasExpectancyInputs && edge.totalTrades !== "" && totalTrades > 0;
    const totalProjected = expectancy * totalTrades;

    const accountBal = num(edge.accountBalance);
    const hasBalance = accountBal > 0;
    const riskPct = hasBalance && al > 0 ? (al / accountBal) * 100 : 0;
    const rewardPct = hasBalance && aw > 0 ? (aw / accountBal) * 100 : 0;
    const expectancyPct = hasBalance && hasExpectancyInputs ? (expectancy / accountBal) * 100 : 0;
    const projectedBalance = accountBal + totalProjected;
    const projectedBalancePct = hasBalance && totalProjected ? (totalProjected / accountBal) * 100 : 0;

    body = (
      <>
        <Readout
          eyebrow="Expectancy per Trade"
          value={hasExpectancyInputs ? `${expectancy > 0 ? "+" : ""}${fmt(expectancy)}` : "\u2014"}
          sub={
            hasExpectancyInputs
              ? hasTotalProjection
                ? hasBalance
                  ? `$${fmt(projectedBalance, 0)} projected balance after ${fmt(totalTrades, 0)} trades (${projectedBalancePct >= 0 ? "+" : ""}${fmt(projectedBalancePct, 1)}%)`
                  : `${totalProjected > 0 ? "+" : ""}$${fmt(Math.abs(totalProjected), 0)} projected over ${fmt(totalTrades, 0)} trades`
                : hasBalance
                ? `${expectancyPct >= 0 ? "+" : ""}${fmt(expectancyPct, 2)}% of balance per trade`
                : `${per100 > 0 ? "+" : ""}${fmt(per100, 2)} projected per 100 trades`
              : "Add account balance and average win/loss below"
          }
          tone={hasExpectancyInputs ? (expectancy > 0 ? "good" : expectancy < 0 ? "bad" : undefined) : undefined}
        />

        <div className={`grid grid-cols-2 gap-3 ${hasBalance ? "mb-3" : "mb-6"}`}>
          <StatChip label="R:R Ratio" value={`1 : ${ratio ? ratio.toFixed(2) : "0.00"}`} />
          <StatChip label="Breakeven Win %" value={beWin ? `${beWin.toFixed(1)}%` : "\u2014"} />
        </div>
        {hasBalance && (
          <div className="grid grid-cols-2 gap-3 mb-6">
            <StatChip label="Risk % of Balance" value={riskPct ? `${riskPct.toFixed(2)}%` : "\u2014"} />
            <StatChip label="Reward % of Balance" value={rewardPct ? `${rewardPct.toFixed(2)}%` : "\u2014"} />
          </div>
        )}

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Trade Setup</span>
        <Field label="Account Balance" value={edge.accountBalance} suffix="$" placeholder="10000" onChange={(e) => setEdge({ ...edge, accountBalance: e.target.value })} />
        <Field label="Entry Price" value={edge.entry} placeholder="2415.20" onChange={(e) => setEdge({ ...edge, entry: e.target.value })} />
        <Field label="Stop Loss" value={edge.stop} placeholder="2410.00" onChange={(e) => setEdge({ ...edge, stop: e.target.value })} />
        <Field label="Take Profit" value={edge.target} placeholder="2426.80" onChange={(e) => setEdge({ ...edge, target: e.target.value })} />
        <p className="text-xs -mt-2 mb-4" style={{ color: palette.textFaint }}>Risk {fmt(risk)} pts \u00b7 Reward {fmt(reward)} pts</p>

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Win / Loss Profile</span>
        <Field label="Average Win" value={edge.avgWin} suffix="$" placeholder="150" onChange={(e) => setEdge({ ...edge, avgWin: e.target.value })} />
        <Field label="Average Loss" value={edge.avgLoss} suffix="$" placeholder="75" onChange={(e) => setEdge({ ...edge, avgLoss: e.target.value })} />
        {hasBalance && (
          <p className="text-xs -mt-2 mb-4" style={{ color: palette.textFaint }}>Avg win {rewardPct.toFixed(2)}% \u00b7 Avg loss {riskPct.toFixed(2)}% of balance</p>
        )}
        <Field label="Total Trades" value={edge.totalTrades} placeholder="100" onChange={(e) => setEdge({ ...edge, totalTrades: e.target.value })} />
        <Field label="Win Rate" value={computedWinRate ? fmt(computedWinRate, 1) : "0"} suffix="%" readOnly onChange={() => {}} />
        <Field label="Safety Buffer" value={edge.buffer} suffix="%" onChange={(e) => setEdge({ ...edge, buffer: e.target.value })} />
        <p className="text-xs -mt-2 mb-4" style={{ color: palette.textFaint }}>Target win rate with buffer: {targetWinRate.toFixed(1)}%</p>
      </>
    );
  }

  if (activeTab === "consistency") {
    const hasStart = cs.startBal !== "";
    const hasBoth = hasStart && cs.currentBal !== "";
    const hasTarget = cs.targetPct !== "instant";

    const startBal = num(cs.startBal);
    const currentBal = num(cs.currentBal);
    const targetPct = hasTarget ? num(cs.targetPct) : 0;
    const dailyLossPct = num(cs.dailyLossPct);
    const todayLoss = num(cs.todayLoss);
    const bestDay = num(cs.bestDay);
    const rule = num(cs.rule);
    const maxDrawdownPct = 4;

    const totalProfit = hasBoth ? currentBal - startBal : 0;
    const targetAmount = hasTarget ? startBal * (targetPct / 100) : 0;
    const progressPct = hasBoth && hasTarget && targetAmount > 0 ? (totalProfit / targetAmount) * 100 : 0;
    const remainingToTarget = hasTarget ? Math.max(0, targetAmount - totalProfit) : 0;

    const dailyLossAllowed = startBal * (dailyLossPct / 100);
    const dailyPass = hasStart ? todayLoss <= dailyLossAllowed : undefined;
    const dailyRemaining = Math.max(0, dailyLossAllowed - todayLoss);

    const peakBalance = hasBoth ? Math.max(startBal, currentBal) : startBal;
    const maxDrawdownAllowed = peakBalance * (maxDrawdownPct / 100);
    const floorBalance = peakBalance - maxDrawdownAllowed;
    const overallPass = hasBoth ? currentBal >= floorBalance : undefined;
    const overallRemaining = Math.max(0, currentBal - floorBalance);

    const consistencyScore = hasBoth && totalProfit > 0 ? (bestDay / totalProfit) * 100 : 0;
    const consistencyPass = hasBoth && totalProfit > 0 ? consistencyScore <= rule : undefined;
    const reqTotalForConsistency = rule > 0 ? bestDay / (rule / 100) : 0;
    const moreNeededForConsistency = Math.max(0, reqTotalForConsistency - totalProfit);

    const inDrawdown = hasBoth && currentBal < peakBalance;
    const currentDrawdownPct = inDrawdown && peakBalance > 0 ? ((peakBalance - currentBal) / peakBalance) * 100 : 0;
    const recoveryNeededPct = inDrawdown && currentDrawdownPct < 100 ? (currentDrawdownPct / (100 - currentDrawdownPct)) * 100 : 0;
    const recoveryDollar = inDrawdown ? peakBalance - currentBal : 0;

    body = (
      <>
        <Readout
          eyebrow={!hasTarget ? (hasBoth && totalProfit < 0 ? "You Need More for Payout" : "Your Payout Amount") : "Profit Target Progress"}
          value={!hasTarget ? (hasBoth ? `${totalProfit < 0 ? "-" : ""}$${fmt(Math.abs(totalProfit))}` : "Instant") : (hasBoth ? progressPct.toFixed(1) : "0.0")}
          unit={!hasTarget ? undefined : "%"}
          sub={
            !hasTarget
              ? (hasBoth ? (totalProfit < 0 ? "Your balance is below your starting balance" : "No profit target required for this challenge type") : "Enter starting & current balance below")
              : (hasBoth ? `$${fmt(totalProfit)} of $${fmt(targetAmount)} target ($${fmt(remainingToTarget)} to go)` : "Enter starting & current balance below")
          }
          tone={!hasTarget ? (hasBoth ? (totalProfit < 0 ? "bad" : "good") : undefined) : (!hasBoth ? undefined : progressPct >= 100 ? "good" : totalProfit < 0 ? "bad" : undefined)}
        />

        <RuleRow label="Daily Drawdown" detail={dailyPass === undefined ? "Enter starting balance below" : dailyPass ? `$${fmt(dailyRemaining)} of daily buffer left` : `Over by $${fmt(todayLoss - dailyLossAllowed)}`} pass={dailyPass} />
        <RuleRow label="Max Drawdown" detail={overallPass === undefined ? "Enter both balances below" : overallPass ? `$${fmt(overallRemaining)} of loss buffer left` : `Below floor by $${fmt(floorBalance - currentBal)}`} pass={overallPass} />
        <RuleRow label="Consistency Rule" detail={consistencyPass === undefined ? "Needs positive total profit" : consistencyPass ? `${consistencyScore.toFixed(1)}% within the ${rule}% rule` : `Need $${fmt(moreNeededForConsistency)} more total profit`} pass={consistencyPass} />

        <span className="block mt-6 mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Recovery</span>
        {!hasBoth ? (
          <p className="text-xs mb-4" style={{ color: palette.textMuted }}>Enter starting & current balance below to see recovery stats.</p>
        ) : inDrawdown ? (
          <>
            <div className="grid grid-cols-2 gap-3 mb-2">
              <StatChip label="Current Drawdown" value={`${currentDrawdownPct.toFixed(1)}%`} />
              <StatChip label="Gain to Recover" value={`+${recoveryNeededPct.toFixed(1)}%`} />
            </div>
            <p className="text-xs mb-4" style={{ color: palette.textMuted }}>${fmt(recoveryDollar)} below your peak balance of ${fmt(peakBalance)}</p>
          </>
        ) : (
          <p className="text-xs mb-4" style={{ color: palette.textMuted }}>At or above peak balance. No recovery needed.</p>
        )}

        <span className="block mt-2 mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Account</span>
        <Field label="Starting Balance" value={cs.startBal} suffix="$" placeholder="10000" onChange={(e) => setCs({ ...cs, startBal: e.target.value })} />
        <Field label="Current Balance" value={cs.currentBal} suffix="$" placeholder="10650" onChange={(e) => setCs({ ...cs, currentBal: e.target.value })} />

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Profit Target</span>
        <div className="flex gap-2 flex-wrap mb-4">
          {PROFIT_TARGET_OPTIONS.map((opt) => {
            const active = String(cs.targetPct) === String(opt);
            return (
              <button key={opt} type="button" onClick={() => setCs({ ...cs, targetPct: String(opt) })} className="px-3 py-1.5 rounded-full transition-colors"
                style={{ background: active ? palette.gold : palette.field, color: active ? palette.letterbox : palette.textMuted, border: `1px solid ${active ? palette.gold : palette.border}`, fontFamily: mono, fontSize: "13px" }}>
                {opt}%
              </button>
            );
          })}
          <button type="button" onClick={() => setCs({ ...cs, targetPct: "instant" })} className="px-3 py-1.5 rounded-full transition-colors"
            style={{ background: !hasTarget ? palette.gold : palette.field, color: !hasTarget ? palette.letterbox : palette.textMuted, border: `1px solid ${!hasTarget ? palette.gold : palette.border}`, fontFamily: mono, fontSize: "13px" }}>
            Instant
          </button>
        </div>
        {!hasTarget && <p className="text-xs -mt-2 mb-4" style={{ color: palette.textFaint }}>Instant challenges skip the profit target entirely.</p>}

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Daily Drawdown</span>
        <PillGroup options={[2, 3, 4, 5, 6]} value={cs.dailyLossPct} onChange={(v) => setCs({ ...cs, dailyLossPct: v })} />
        <Field label="Loss Today" value={cs.todayLoss} suffix="$" placeholder="0" onChange={(e) => setCs({ ...cs, todayLoss: e.target.value })} />

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Max Drawdown</span>
        <p className="text-xs mb-4" style={{ color: palette.textMuted }}>Fixed at 4%, trailing off your peak balance (starting or current, whichever is higher).</p>

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Consistency Rule</span>
        <PillGroup options={[0, 15, 20, 25, 30, 40]} value={cs.rule} onChange={(v) => setCs({ ...cs, rule: v })} />
        <Field label="Best Single Day Profit" value={cs.bestDay} suffix="$" placeholder="800" onChange={(e) => setCs({ ...cs, bestDay: e.target.value })} />

        <p className="text-xs mt-1" style={{ color: palette.textFaint }}>Limits shown are common presets, use your specific firm's rules for anything that matters.</p>
      </>
    );
  }

  if (activeTab === "size") {
    const bal = num(ps.balance);
    const riskPct = num(ps.riskPct);
    const stopPips = num(ps.stopPips);
    const valPerPip = num(ps.valuePerPip);
    const riskAmt = bal * (riskPct / 100);
    const lots = stopPips > 0 && valPerPip > 0 ? riskAmt / (stopPips * valPerPip) : 0;
    body = (
      <>
        <Readout eyebrow="Position Size" value={fmt(lots)} unit="lots" sub={`Risking $${fmt(riskAmt)} (${riskPct || 0}% of account)`} />
        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Instrument</span>
        <div className="flex gap-2 mb-4">
          {[{ id: "forex", label: "Forex" }, { id: "gold", label: "Gold" }, { id: "custom", label: "Custom" }].map((p) => (
            <button key={p.id} type="button" onClick={() => applyPreset(p.id)} className="px-3 py-1.5 rounded-full"
              style={{ background: ps.preset === p.id ? palette.gold : palette.field, color: ps.preset === p.id ? palette.letterbox : palette.textMuted, border: `1px solid ${ps.preset === p.id ? palette.gold : palette.border}`, fontFamily: mono, fontSize: "13px" }}>
              {p.label}
            </button>
          ))}
        </div>
        <Field label="Account Balance" value={ps.balance} suffix="$" placeholder="5000" onChange={(e) => setPs({ ...ps, balance: e.target.value })} />
        <Field label="Risk per Trade" value={ps.riskPct} suffix="%" placeholder="1" onChange={(e) => setPs({ ...ps, riskPct: e.target.value })} />
        <Field label="Stop Distance" value={ps.stopPips} suffix="pips" placeholder="25" onChange={(e) => setPs({ ...ps, stopPips: e.target.value })} />
        <Field label="Value per Pip (1.0 lot)" value={ps.valuePerPip} suffix="$" onChange={(e) => setPs({ ...ps, preset: "custom", valuePerPip: e.target.value })} />
        <p className="text-xs mt-1" style={{ color: palette.textFaint }}>Pip values are typical defaults, confirm your broker's contract specs before sizing real trades.</p>
      </>
    );
  }

  if (activeTab === "fx") {
    const amount = num(fx.amount);
    const perUsdFrom = FX_RATES_PER_USD[fx.from] ?? 1;
    const perUsdTo = FX_RATES_PER_USD[fx.to] ?? 1;
    const builtInRate = perUsdFrom > 0 ? perUsdTo / perUsdFrom : 0;
    const customRateNum = num(fx.customRate);
    const usingCustomRate = fx.customRate !== "" && customRateNum > 0;
    const effectiveRate = usingCustomRate ? customRateNum : builtInRate;
    const converted = amount * effectiveRate;
    const inverseRate = effectiveRate > 0 ? 1 / effectiveRate : 0;
    const sameCurrency = fx.from === fx.to;
    const swap = () => setFx({ ...fx, from: fx.to, to: fx.from, customRate: "" });

    body = (
      <>
        <Readout
          eyebrow={`${fx.from} \u2192 ${fx.to}`}
          value={sameCurrency ? fmtThousands(amount) : fmtThousands(converted)}
          unit={fx.to}
          sub={sameCurrency ? "Same currency on both sides" : `1 ${fx.from} = ${fmt(effectiveRate, 4)} ${fx.to} \u00b7 1 ${fx.to} = ${fmt(inverseRate, 4)} ${fx.from}`}
        />
        <Field label="Amount" value={fx.amount} suffix={fx.from} placeholder="100" onChange={(e) => setFx({ ...fx, amount: e.target.value })} />
        <div className="flex items-end gap-2 mb-1">
          <CurrencySelect label="From" value={fx.from} onChange={(e) => setFx({ ...fx, from: e.target.value, customRate: "" })} />
          <button type="button" onClick={swap} className="flex items-center justify-center rounded-lg flex-shrink-0 mb-4"
            style={{ width: "44px", height: "48px", background: palette.field, border: `1px solid ${palette.border}`, color: palette.gold }} aria-label="Swap currencies">
            <SwapIcon size={16} />
          </button>
          <CurrencySelect label="To" value={fx.to} onChange={(e) => setFx({ ...fx, to: e.target.value, customRate: "" })} />
        </div>
        <div className="grid grid-cols-2 gap-3 mb-6">
          <StatChip label="Rate used" value={usingCustomRate ? "Custom" : FX_SNAPSHOT_LABEL} />
          <StatChip label={`${fx.to} per ${fx.from}`} value={fmt(effectiveRate, 4)} />
        </div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Rate Override</span>
          {usingCustomRate && (
            <button type="button" onClick={() => setFx({ ...fx, customRate: "" })} className="flex items-center gap-1" style={{ color: palette.textFaint, fontSize: "11px", fontFamily: mono }}>
              <RotateCcwIcon size={11} /> Reset
            </button>
          )}
        </div>
        <Field label={`1 ${fx.from} =`} value={fx.customRate} suffix={fx.to} placeholder={fmt(builtInRate, 4)} onChange={(e) => setFx({ ...fx, customRate: e.target.value })} />
        <p className="text-xs -mt-2 mb-4" style={{ color: palette.textFaint }}>
          Built-in rates are a {FX_SNAPSHOT_LABEL} snapshot, not live. For anything that matters, check your bank or exchange's current rate and paste it above to convert precisely.
        </p>
      </>
    );
  }

  if (activeTab === "curve") {
    const startBal = num(startingBalance);
    const wins = trades.filter((t) => t.pnl > 0);
    const losses = trades.filter((t) => t.pnl < 0);
    const netPnl = trades.reduce((s, t) => s + t.pnl, 0);
    const winRate = trades.length > 0 ? (wins.length / trades.length) * 100 : 0;
    const avgWin = wins.length > 0 ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
    const avgLoss = losses.length > 0 ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 0;

    let running = startBal, peak = startBal, maxDrawdown = 0;
    const chartData = [{ trade: 0, equity: startBal }];
    trades.forEach((t, i) => {
      running += t.pnl;
      peak = Math.max(peak, running);
      maxDrawdown = Math.max(maxDrawdown, peak - running);
      chartData.push({ trade: i + 1, equity: running });
    });

    let bestStreak = 0, worstStreak = 0, curStreak = 0;
    trades.forEach((t) => {
      if (t.pnl > 0) curStreak = curStreak > 0 ? curStreak + 1 : 1;
      else if (t.pnl < 0) curStreak = curStreak < 0 ? curStreak - 1 : -1;
      else curStreak = 0;
      bestStreak = Math.max(bestStreak, curStreak);
      worstStreak = Math.min(worstStreak, curStreak);
    });

    const sortedTrades = [...trades].sort((a, b) => a.ts - b.ts);
    const revengeIds = new Set();
    for (let i = 1; i < sortedTrades.length; i++) {
      const prev = sortedTrades[i - 1];
      const cur = sortedTrades[i];
      if (prev.pnl < 0 && cur.ts - prev.ts <= REVENGE_WINDOW_MS) revengeIds.add(cur.id);
    }
    const revengeTrades = sortedTrades.filter((t) => revengeIds.has(t.id));
    const revengeCount = revengeTrades.length;
    const revengeLossCount = revengeTrades.filter((t) => t.pnl < 0).length;
    const revengeLossRate = revengeCount > 0 ? (revengeLossCount / revengeCount) * 100 : 0;
    const revengePnl = revengeTrades.reduce((s, t) => s + t.pnl, 0);

    const emotionStats = EMOTIONS.map((e) => {
      const tagged = trades.filter((t) => t.emotion === e.id);
      const tWins = tagged.filter((t) => t.pnl > 0).length;
      const rate = tagged.length > 0 ? (tWins / tagged.length) * 100 : 0;
      const pnl = tagged.reduce((s, t) => s + t.pnl, 0);
      return { ...e, count: tagged.length, rate, pnl };
    }).filter((e) => e.count > 0);

    const tradesByDay = {};
    trades.forEach((t) => {
      const k = dayKeyFromTs(t.ts);
      if (!tradesByDay[k]) tradesByDay[k] = { total: 0, trades: [] };
      tradesByDay[k].total += t.pnl;
      tradesByDay[k].trades.push(t);
    });

    const viewYear = calMonth.getFullYear();
    const viewMonthIdx = calMonth.getMonth();
    const firstWeekday = new Date(viewYear, viewMonthIdx, 1).getDay();
    const totalDaysInMonth = new Date(viewYear, viewMonthIdx + 1, 0).getDate();
    const monthCells = [];
    for (let i = 0; i < firstWeekday; i++) monthCells.push(null);
    for (let d = 1; d <= totalDaysInMonth; d++) monthCells.push(d);
    while (monthCells.length % 7 !== 0) monthCells.push(null);

    const monthPrefix = `${viewYear}-${pad2(viewMonthIdx + 1)}`;
    const monthTotal = Object.keys(tradesByDay).reduce((sum, k) => (k.startsWith(monthPrefix) ? sum + tradesByDay[k].total : sum), 0);
    const monthTradeCount = Object.keys(tradesByDay).reduce((sum, k) => (k.startsWith(monthPrefix) ? sum + tradesByDay[k].trades.length : sum), 0);

    const todayKey = dayKeyFromDate(new Date());
    const selectedInfo = selectedDay ? tradesByDay[selectedDay] : null;

    const goPrevMonth = () => { setCalMonth(new Date(viewYear, viewMonthIdx - 1, 1)); setSelectedDay(null); };
    const goNextMonth = () => { setCalMonth(new Date(viewYear, viewMonthIdx + 1, 1)); setSelectedDay(null); };

    body = (
      <>
        <Readout
          eyebrow="Equity"
          value={`${netPnl >= 0 ? "+" : "-"}$${fmt(Math.abs(netPnl))}`}
          sub={trades.length > 0 ? `${trades.length} trade${trades.length === 1 ? "" : "s"} logged \u00b7 ${winRate.toFixed(1)}% win rate` : "Log your first trade below to start the curve"}
          tone={netPnl > 0 ? "good" : netPnl < 0 ? "bad" : undefined}
        />

        {trades.length > 0 && (
          <div className="rounded-2xl p-4 mb-6" style={{ background: palette.surface, border: `1px solid ${palette.border}` }}>
            <EquityChart data={chartData} startBal={startBal} positive={netPnl >= 0} />
          </div>
        )}

        <div className="grid grid-cols-2 gap-3 mb-2">
          <StatChip label="Win Rate" value={trades.length ? `${winRate.toFixed(1)}%` : "\u2014"} />
          <StatChip label="Avg Win / Loss" value={trades.length ? `$${fmt(avgWin, 0)} / $${fmt(avgLoss, 0)}` : "\u2014"} />
          <StatChip label="Max Drawdown" value={trades.length ? `$${fmt(maxDrawdown, 0)}` : "\u2014"} />
          <StatChip label="Best / Worst Streak" value={trades.length ? `+${bestStreak} / ${worstStreak}` : "\u2014"} />
        </div>
        <p className="text-xs mt-2 mb-6" style={{ color: palette.textFaint }}>Streaks count consecutive wins (positive) or losses (negative).</p>

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Trading Psychology</span>
        <div className="grid grid-cols-2 gap-3 mb-2">
          <StatChip label="Revenge Trades" value={trades.length ? `${revengeCount} of ${trades.length}` : "\u2014"} />
          <StatChip label="Revenge Trade P&L" value={revengeCount ? `${revengePnl >= 0 ? "+" : "-"}$${fmt(Math.abs(revengePnl), 0)}` : "\u2014"} />
        </div>
        <p className="text-xs mb-4" style={{ color: palette.textFaint }}>
          {revengeCount > 0
            ? `A trade counts as "revenge" when it's opened within ${REVENGE_WINDOW_MINUTES} minutes of a loss. ${revengeLossRate.toFixed(0)}% of those ended in another loss.`
            : `A trade opened within ${REVENGE_WINDOW_MINUTES} minutes of a loss is flagged here as a possible revenge trade.`}
        </p>

        {emotionStats.length > 0 && (
          <>
            <div className="mb-2">
              {emotionStats.map((e) => (
                <div key={e.id} className="flex items-center justify-between rounded-lg px-3 py-2.5 mb-2" style={{ background: palette.surface, border: `1px solid ${palette.border}` }}>
                  <div className="flex items-center gap-2">
                    <span style={{ fontSize: "16px" }}>{e.emoji}</span>
                    <span style={{ color: palette.text, fontSize: "13px" }}>{e.label}</span>
                    <span style={{ color: palette.textFaint, fontSize: "11px", fontFamily: mono }}>\u00d7{e.count}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span style={{ fontFamily: mono, fontSize: "12px", color: e.pnl >= 0 ? palette.green : palette.red }}>{e.pnl >= 0 ? "+" : "-"}${fmt(Math.abs(e.pnl), 0)}</span>
                    <span style={{ fontFamily: mono, fontSize: "12px", color: palette.textMuted, minWidth: "42px", textAlign: "right" }}>{e.rate.toFixed(0)}%</span>
                  </div>
                </div>
              ))}
            </div>
            <p className="text-xs mb-6" style={{ color: palette.textFaint }}>Win rate by the mood tagged when each trade was logged.</p>
          </>
        )}

        <Field label="Starting Balance" value={startingBalance} suffix="$" placeholder="10000" onChange={(e) => persistStartingBalance(e.target.value)} />

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Log a Trade</span>
        <div className="flex gap-2 mb-2">
          <div className="flex items-center rounded-lg px-3 flex-1" style={{ background: palette.field, border: `1px solid ${palette.border}` }}>
            <span className="text-sm pr-1" style={{ color: palette.textFaint }}>$</span>
            <input type="text" inputMode="decimal" value={tradeInput} onChange={(e) => setTradeInput(e.target.value)} placeholder="+120 or -60"
              className="w-full bg-transparent py-3 outline-none" style={{ color: palette.text, fontFamily: mono, fontSize: "16px" }} />
          </div>
          <button type="button" onClick={addTrade} className="flex items-center justify-center rounded-lg flex-shrink-0" style={{ width: "46px", background: palette.gold, color: palette.letterbox }} aria-label="Add trade">
            <PlusIcon size={20} strokeWidth={2.4} />
          </button>
        </div>
        <input type="text" value={tradeNote} onChange={(e) => setTradeNote(e.target.value)} placeholder="Note (optional)"
          className="w-full rounded-lg px-3 py-2.5 mb-2 bg-transparent outline-none" style={{ background: palette.field, border: `1px solid ${palette.border}`, color: palette.textMuted, fontSize: "13px" }} />

        <div className="flex gap-2 flex-wrap mb-2">
          {EMOTIONS.map((e) => {
            const active = tradeEmotion === e.id;
            return (
              <button key={e.id} type="button" onClick={() => setTradeEmotion(active ? null : e.id)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full"
                style={{ background: active ? palette.gold : palette.field, color: active ? palette.letterbox : palette.textMuted, border: `1px solid ${active ? palette.gold : palette.border}`, fontSize: "13px" }}>
                <span>{e.emoji}</span>{e.label}
              </button>
            );
          })}
        </div>
        <p className="text-xs mb-4" style={{ color: palette.textFaint }}>
          Enter net P&amp;L for the trade. Positive logs a win, negative logs a loss. Tagging your mood (optional) is what powers the psychology stats above.
        </p>

        {storageError && <p className="text-xs mb-4" style={{ color: palette.red }}>{storageError}</p>}

        {!tradesLoaded ? (
          <p className="text-xs mb-4" style={{ color: palette.textFaint }}>Loading saved trades\u2026</p>
        ) : (
          <>
            <div className="flex items-center justify-between mb-1.5">
              <span className="uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Calendar</span>
              {trades.length > 0 && (
                <button type="button" onClick={() => { clearTrades(); setSelectedDay(null); }} style={{ color: palette.textFaint, fontSize: "11px", fontFamily: mono }}>Clear all</button>
              )}
            </div>

            <div className="rounded-2xl p-4 mb-4" style={{ background: palette.surface, border: `1px solid ${palette.border}` }}>
              <div className="flex items-center justify-between mb-3">
                <button type="button" onClick={goPrevMonth} aria-label="Previous month" style={{ color: palette.textMuted, padding: "2px" }}><ChevronLeftIcon size={18} /></button>
                <div style={{ fontFamily: mono, fontSize: "13px", color: palette.text, letterSpacing: "0.04em" }}>{MONTH_NAMES[viewMonthIdx]} {viewYear}</div>
                <button type="button" onClick={goNextMonth} aria-label="Next month" style={{ color: palette.textMuted, padding: "2px" }}><ChevronRightIcon size={18} /></button>
              </div>

              <div className="grid grid-cols-7 gap-1 mb-1.5">
                {WEEKDAY_LABELS.map((w, i) => (<div key={i} className="text-center" style={{ fontSize: "10px", color: palette.textFaint, fontFamily: mono }}>{w}</div>))}
              </div>

              <div className="grid grid-cols-7 gap-1">
                {monthCells.map((d, i) => {
                  if (d === null) return <div key={i} />;
                  const key = `${monthPrefix}-${pad2(d)}`;
                  const info = tradesByDay[key];
                  const hasTrades = !!info;
                  const isToday = key === todayKey;
                  const isSelected = key === selectedDay;
                  const posDay = hasTrades && info.total >= 0;
                  return (
                    <button key={i} type="button" onClick={() => hasTrades && setSelectedDay(isSelected ? null : key)} className="flex flex-col items-center justify-center rounded-lg"
                      style={{ aspectRatio: "1", background: hasTrades ? (posDay ? `${palette.green}26` : `${palette.red}26`) : "transparent", border: `1px solid ${isSelected ? palette.gold : isToday ? palette.textMuted : "transparent"}`, cursor: hasTrades ? "pointer" : "default" }}>
                      <span style={{ fontSize: "11px", color: hasTrades ? palette.text : palette.textFaint, fontFamily: mono }}>{d}</span>
                      {hasTrades && <span style={{ fontSize: "9px", color: posDay ? palette.green : palette.red, fontFamily: mono }}>{posDay ? "+" : "-"}{fmt(Math.abs(info.total), 0)}</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 mb-4">
              <StatChip label={`${MONTH_NAMES[viewMonthIdx]} Total`} value={`${monthTotal >= 0 ? "+" : "-"}$${fmt(Math.abs(monthTotal), 0)}`} />
              <StatChip label={`${MONTH_NAMES[viewMonthIdx]} Trades`} value={String(monthTradeCount)} />
            </div>

            {selectedInfo && (
              <>
                <div className="flex items-center justify-between mb-1.5">
                  <span className="uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>{formatDayLabel(selectedDay)}</span>
                  <span style={{ fontFamily: mono, fontSize: "12px", color: selectedInfo.total >= 0 ? palette.green : palette.red }}>{selectedInfo.total >= 0 ? "+" : "-"}${fmt(Math.abs(selectedInfo.total), 0)}</span>
                </div>
                {selectedInfo.trades.map((t) => (
                  <div key={t.id} className="flex items-center justify-between rounded-lg px-3 py-2.5 mb-2" style={{ background: palette.surface, border: `1px solid ${palette.border}` }}>
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span style={{ fontFamily: mono, fontSize: "14px", color: t.pnl >= 0 ? palette.green : palette.red }}>{t.pnl >= 0 ? "+" : "-"}${fmt(Math.abs(t.pnl), 0)}</span>
                        {t.emotion && emotionMeta(t.emotion) && <span style={{ fontSize: "13px" }}>{emotionMeta(t.emotion).emoji}</span>}
                        {revengeIds.has(t.id) && (
                          <span style={{ fontSize: "10px", fontFamily: mono, color: palette.red, border: `1px solid ${palette.red}`, borderRadius: "999px", padding: "1px 6px" }}>revenge</span>
                        )}
                      </div>
                      {t.note && <div style={{ color: palette.textMuted, fontSize: "12px" }}>{t.note}</div>}
                    </div>
                    <button type="button" onClick={() => deleteTrade(t.id)} style={{ color: palette.textFaint }} aria-label="Delete trade"><TrashIcon size={15} /></button>
                  </div>
                ))}
              </>
            )}

            {trades.length === 0 && <p className="text-xs mb-4" style={{ color: palette.textFaint }}>No trades logged yet. Log one below and it'll land on today's date.</p>}
            {trades.length > 0 && !selectedInfo && <p className="text-xs mb-4" style={{ color: palette.textFaint }}>Tap a highlighted day to see its trades.</p>}
          </>
        )}
      </>
    );
  }

  if (activeTab === "news") {
    const now = new Date();
    const withOcc = newsEvents.map((ev) => ({ ev, occMs: nextOccurrenceMs(ev) }));
    const future = withOcc.filter((x) => x.occMs >= now.getTime()).sort((a, b) => a.occMs - b.occMs);
    const next = future[0];
    const nextMs = next ? next.occMs - now.getTime() : Infinity;
    const nextLabel = next ? `${next.ev.date} \u00b7 ${next.ev.time}` : "";
    const impactColor = (level) => (level === "high" ? palette.red : level === "medium" ? palette.goldBright : palette.textMuted);

    const dayGroups = {};
    withOcc.forEach(({ ev, occMs }) => {
      const d = new Date(occMs);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      if (!dayGroups[key]) dayGroups[key] = [];
      dayGroups[key].push({ ev, occMs });
    });
    const dayKeys = Object.keys(dayGroups).sort();

    body = (
      <>
        <Readout
          eyebrow="Next USD Event"
          value={next ? formatCountdown(nextMs) : "\u2014"}
          sub={next ? `${next.ev.name} \u00b7 ${nextLabel}` : "No upcoming events \u2014 add one below"}
          tone={next && next.ev.impact === "high" && nextMs < 60 * 60 * 1000 ? "bad" : undefined}
        />

        {!newsLoaded ? (
          <p className="text-xs mb-4" style={{ color: palette.textFaint }}>Loading saved events\u2026</p>
        ) : newsEvents.length === 0 ? (
          <p className="text-xs mb-4" style={{ color: palette.textFaint }}>No events added yet. Add one below to start tracking it.</p>
        ) : (
          dayKeys.map((key) => {
            const dayDate = new Date(`${key}T00:00:00`);
            const dayLabel = dayDate.toLocaleDateString("default", { weekday: "long", month: "short", day: "numeric" });
            const isPast = dayGroups[key].every((x) => x.occMs < now.getTime());
            return (
              <div key={key} className="mb-4">
                <div className="uppercase mb-1.5" style={{ color: isPast ? palette.textFaint : palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>{dayLabel}</div>
                {dayGroups[key].sort((a, b) => a.ev.time.localeCompare(b.ev.time)).map(({ ev, occMs }) => {
                  const passed = occMs < now.getTime();
                  return (
                    <div key={ev.id} className="flex items-center justify-between rounded-lg px-3 py-2.5 mb-2" style={{ background: palette.surface, border: `1px solid ${palette.border}`, opacity: passed ? 0.55 : 1 }}>
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span style={{ color: palette.text, fontSize: "14px" }}>{ev.name}</span>
                          <span style={{ fontSize: "9px", fontFamily: mono, color: impactColor(ev.impact), border: `1px solid ${impactColor(ev.impact)}`, borderRadius: "999px", padding: "1px 6px", textTransform: "uppercase" }}>{ev.impact}</span>
                        </div>
                        <div style={{ color: palette.textMuted, fontSize: "12px" }}>{ev.time}{passed ? " \u00b7 released" : ""}</div>
                      </div>
                      <button type="button" onClick={() => deleteNewsEvent(ev.id)} style={{ color: palette.textFaint }} aria-label="Delete event"><TrashIcon size={15} /></button>
                    </div>
                  );
                })}
              </div>
            );
          })
        )}

        <p className="text-xs mt-1 mb-6" style={{ color: palette.textFaint }}>
          Nothing here is added automatically \u2014 add the events you want to track below.
        </p>

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Add Event</span>
        <label className="block mb-4">
          <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Event Name</span>
          <div className="flex items-center rounded-lg px-3" style={{ background: palette.field, border: `1px solid ${palette.border}` }}>
            <input type="text" value={newEventName} onChange={(e) => setNewEventName(e.target.value)} placeholder="Non-Farm Payrolls"
              className="w-full bg-transparent py-3 outline-none" style={{ color: palette.text, fontFamily: mono, fontSize: "16px" }} />
          </div>
        </label>

        <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Impact</span>
        <div className="flex gap-2 mb-4">
          {["high", "medium", "low"].map((lvl) => (
            <button key={lvl} type="button" onClick={() => setNewEventImpact(lvl)} className="px-3 py-1.5 rounded-full"
              style={{ background: newEventImpact === lvl ? impactColor(lvl) : palette.field, color: newEventImpact === lvl ? palette.letterbox : palette.textMuted, border: `1px solid ${newEventImpact === lvl ? impactColor(lvl) : palette.border}`, fontFamily: mono, fontSize: "13px", textTransform: "capitalize" }}>
              {lvl}
            </button>
          ))}
        </div>

        <label className="block mb-4">
          <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Date</span>
          <div className="rounded-lg px-3" style={{ background: palette.field, border: `1px solid ${palette.border}` }}>
            <input type="date" value={newEventDate} onChange={(e) => setNewEventDate(e.target.value)} className="w-full bg-transparent py-3 outline-none" style={{ color: palette.text, fontFamily: mono, fontSize: "15px" }} />
          </div>
        </label>

        <label className="block mb-4">
          <span className="block mb-1.5 uppercase" style={{ color: palette.textMuted, letterSpacing: "0.08em", fontSize: "11px" }}>Time (local)</span>
          <div className="rounded-lg px-3" style={{ background: palette.field, border: `1px solid ${palette.border}` }}>
            <input type="time" value={newEventTime} onChange={(e) => setNewEventTime(e.target.value)} className="w-full bg-transparent py-3 outline-none" style={{ color: palette.text, fontFamily: mono, fontSize: "15px" }} />
          </div>
        </label>

        <button type="button" onClick={addNewsEvent} className="w-full rounded-lg py-3 mb-4" style={{ background: palette.gold, color: palette.letterbox, fontFamily: mono, fontSize: "14px" }}>+ Add Event</button>
      </>
    );
  }

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: palette.letterbox }}>
      <div className="w-full flex flex-col min-h-screen" style={{ maxWidth: "440px", background: palette.bg, fontFamily: sans }}>
        <header className="px-5 pt-6 pb-4 flex-shrink-0" style={{ borderBottom: `1px solid ${palette.border}` }}>
          <div className="uppercase" style={{ color: palette.gold, letterSpacing: "0.16em", fontSize: "11px" }}>Trade Math Calculator</div>
          <h1 className="mt-1" style={{ fontFamily: mono, fontSize: "1.6rem", fontWeight: 700, color: palette.text, letterSpacing: "0.02em" }}>LEDGER</h1>
        </header>

        <main className="flex-1 overflow-y-auto px-5 py-5">{body}</main>

        <nav className="flex-shrink-0 flex overflow-x-auto" style={{ borderTop: `1px solid ${palette.border}`, background: palette.surface }}>
          {TABS.map((tab) => {
            const TabIcon = tab.icon;
            const active = activeTab === tab.id;
            return (
              <div key={tab.id} className="flex items-stretch flex-shrink-0">
                <button type="button" onClick={() => setActiveTab(tab.id)} className="flex flex-col items-center gap-1 py-3 flex-shrink-0" style={{ color: active ? palette.goldBright : palette.textFaint, minWidth: "64px" }}>
                  <TabIcon size={18} strokeWidth={active ? 2.4 : 1.8} />
                  <span style={{ fontSize: "10px", letterSpacing: "0.04em" }}>{tab.label}</span>
                </button>
              </div>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LedgerApp />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
